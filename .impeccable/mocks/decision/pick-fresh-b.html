<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>채점표 · 산뜻 B — 블루＋코랄</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ground:#F4F6F9; --card:#FFFFFF; --rule:#E8ECF2; --ink:#161A20; --mute:#79828E;
    --accent:#2F6BF0;        /* 지금 동작 */
    --accent-soft:#EDF3FF;
    --hit:#FF5B4A;           /* 실수 */
    --pass:#1AA37A;          /* 끝난 동작 · 저장 */
  }
  html,body{width:390px;height:844px;overflow:hidden}
  body{background:var(--ground);color:var(--ink);font-family:"Noto Sans KR",sans-serif;
    font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
  .num{font-family:"Barlow Condensed","Noto Sans KR",sans-serif}

  /* 머리 */
  .head{padding:14px 18px 10px;background:var(--card);border-bottom:1px solid var(--rule)}
  .top{display:flex;align-items:center;justify-content:space-between}
  .ttl{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.1em}
  .save{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--pass)}
  .save i{width:8px;height:8px;border-radius:50%;background:var(--pass)}
  .nm{font-size:27px;font-weight:900;letter-spacing:-.02em;margin-top:2px}
  .nm small{font-size:15px;font-weight:700;color:var(--mute);margin-right:8px}

  /* 몇 번째 도전인지 — 회차 알약. 지난 회차는 점수를 달고 있다 */
  .rounds{display:flex;gap:7px;padding:10px 18px 12px;background:var(--card);
    border-bottom:1px solid var(--rule);align-items:center}
  .rd{display:flex;align-items:baseline;gap:5px;padding:7px 12px;border-radius:999px;
    border:1px solid var(--rule);background:var(--card);font-size:14px;font-weight:700;color:var(--mute)}
  .rd b{font-size:16px;font-weight:900;color:var(--ink)}
  .rd.now{background:var(--accent);border-color:var(--accent);color:#fff}
  .rd.now b{color:#fff}
  .rd.add{margin-left:auto;border-style:dashed;color:var(--accent);border-color:#BFD4FF}

  /* 동작 줄 */
  .rows{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card)}
  .r{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:11px;
    padding:0 18px;height:44px;border-bottom:1px solid var(--rule)}
  .r .i{font-size:15px;font-weight:700;color:var(--mute)}
  .r .n{font-size:16px;font-weight:700}
  .r .v{font-size:20px;font-weight:700}
  .r.done .v{color:var(--pass)}
  .r.todo .i,.r.todo .n{color:#B3BAC4}
  .r.todo .v{color:#D4D9E0;font-size:18px}

  /* 지금 동작 — 줄이 펼쳐져 채점 칸이 된다 */
  .open{background:var(--accent-soft);border-top:2px solid var(--accent);
    border-bottom:1px solid var(--rule);padding:13px 18px 16px;flex:1;min-height:0;
    display:flex;flex-direction:column}
  .open .step{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.06em}
  .open .name{font-size:28px;font-weight:900;line-height:1.15;margin:5px 0 11px;letter-spacing:-.025em}
  .marks{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .mk{width:36px;height:36px;border-radius:9px;background:var(--card);
    border:2px solid #CFE0FF;display:flex;align-items:center;justify-content:center}
  .mk.on{background:var(--hit);border-color:var(--hit)}
  .res{margin-left:auto;font-size:14px;font-weight:700;color:var(--mute)}
  .res b{font-size:27px;font-weight:900;color:var(--ink);margin-left:5px}
  .hit{flex:1;min-height:0;border:none;border-radius:18px;background:var(--hit);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    box-shadow:0 8px 20px rgba(255,91,74,.24)}
  .hit .t{font-size:33px;font-weight:900;letter-spacing:-.01em}
  .hit .s{font-size:14px;font-weight:500;opacity:.95}

  .foot{display:flex;align-items:center;gap:12px;padding:11px 18px 14px;background:var(--card)}
  .undo{flex:none;height:50px;padding:0 20px;border-radius:12px;background:var(--card);
    border:1.5px solid var(--rule);font-size:15px;font-weight:700;color:var(--ink)}
  .hint{font-size:12.5px;font-weight:500;color:var(--mute);line-height:1.4;text-align:right;margin-left:auto}
  .hint b{color:var(--accent);font-weight:700}
  svg{display:block}
</style></head>
<body>

  <div class="head">
    <div class="top"><span class="ttl">음악줄넘기 채점표</span>
      <span class="save"><i></i>저장됨</span></div>
    <div class="nm"><small class="num">1반 7번</small>강지호</div>
  </div>

  <div class="rounds">
    <span class="rd">1차 <b class="num">32</b>점</span>
    <span class="rd now">2차 <b class="num">진행 중</b></span>
    <span class="rd add">＋ 재도전</span>
  </div>

  <div class="rows">
    <div class="r done"><span class="i num">①</span><span class="n">양발모아뛰기</span><span class="v num">5</span></div>
    <div class="r done"><span class="i num">②</span><span class="n">번갈아 뛰기</span><span class="v num">4</span></div>

    <div class="open">
      <div class="step num">3 / 8번째 동작</div>
      <div class="name">③ 번갈아두박자 뛰기</div>
      <div class="marks">
        <span class="mk on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
        <span class="mk on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
        <span class="mk"></span><span class="mk"></span>
        <span class="res">지금<b class="num">3</b>점</span>
      </div>
      <button class="hit">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        <span class="t">실수</span>
        <span class="s">한 번 더 누르면 2점</span>
      </button>
    </div>

    <div class="r todo"><span class="i num">④</span><span class="n">십자 뛰기</span><span class="v num">·</span></div>
    <div class="r todo"><span class="i num">⑤</span><span class="n">가위바위보 뛰기</span><span class="v num">·</span></div>
    <div class="r todo"><span class="i num">⑥</span><span class="n">사이드 오픈</span><span class="v num">·</span></div>
    <div class="r todo"><span class="i num">⑦</span><span class="n">사이드 크로스</span><span class="v num">·</span></div>
    <div class="r todo"><span class="i num">⑧</span><span class="n">크로스 오픈</span><span class="v num">·</span></div>
  </div>

  <div class="foot">
    <button class="undo">↩ 되돌리기</button>
    <div class="hint">위아래로 쓸면 <b>다음 동작</b><br>끝나면 다음 학생으로</div>
  </div>

</body></html>
