<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>노선도 — 채점 중</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --night:#0E1B3D; --night-2:#152450; --porcelain:#FFFFFF; --mute:#8FA0C9;
    --line:#E8402F; --cobalt:#2E6BE6; --amber:#F5A623; --green:#1FA971;
  }
  html,body{width:390px;height:844px;overflow:hidden}
  body{background:var(--night);color:var(--porcelain);
    font-family:"Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column}
  .num{font-family:"Barlow Condensed","Noto Sans KR",sans-serif}

  .head{display:flex;align-items:center;justify-content:space-between;
    padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.14)}
  .who{display:flex;align-items:baseline;gap:9px}
  .who .cls{font-size:15px;font-weight:700;color:var(--mute)}
  .who .nm{font-size:25px;font-weight:900}
  .save{font-size:14px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:7px}
  .save i{width:9px;height:9px;border-radius:50%;background:var(--green)}

  /* 노선 — ①~⑧ 이 여덟 정거장. 지난 역은 선이 그어져 있고 지금 역은 부푼다 */
  .map{flex:1;min-height:0;display:grid;grid-template-columns:118px 1fr;gap:0}
  .rail{position:relative;padding:14px 0 10px}
  .rail .track{position:absolute;left:38px;top:26px;bottom:18px;width:8px;
    border-radius:4px;background:rgba(255,255,255,.12)}
  .rail .done{position:absolute;left:38px;top:26px;height:166px;width:8px;
    border-radius:4px;background:var(--line)}
  .st{position:relative;height:66px;display:flex;align-items:center;gap:13px;padding-left:20px}
  .dot{width:22px;height:22px;border-radius:50%;background:var(--night);
    border:4px solid rgba(255,255,255,.3);z-index:1;flex:none}
  .st.p .dot{border-color:var(--line);background:var(--line)}
  .st .lab{font-size:15px;font-weight:700;color:var(--mute)}
  .st.p .lab{color:var(--porcelain)}
  .st.now{height:92px}
  .st.now .dot{width:34px;height:34px;border:7px solid var(--line);background:var(--porcelain);
    margin-left:-6px;box-shadow:0 0 0 7px rgba(232,64,47,.22);animation:bloom 1.8s ease-in-out infinite}
  @keyframes bloom{0%,100%{box-shadow:0 0 0 6px rgba(232,64,47,.18)}50%{box-shadow:0 0 0 11px rgba(232,64,47,.30)}}
  .st.now .lab{font-size:18px;font-weight:900;color:var(--porcelain)}
  .st .delay{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;
    background:var(--amber);color:#2A1C00;font-size:12px;font-weight:900}

  /* 오른쪽 — 지금 역의 작업 */
  .work{padding:16px 16px 0;display:flex;flex-direction:column;min-height:0}
  .step{font-size:14px;font-weight:700;color:var(--amber);letter-spacing:.05em}
  .name{font-size:27px;font-weight:900;line-height:1.2;margin:5px 0 12px;letter-spacing:-.02em}
  .score{display:flex;align-items:center;gap:9px;margin-bottom:12px;
    padding:9px 12px;border-radius:8px;background:var(--night-2);border:1px solid rgba(255,255,255,.14)}
  .score .lab{font-size:14px;font-weight:700;color:var(--mute)}
  .score b{font-size:26px;font-weight:700}
  .score .m{color:var(--amber)} .score .p{color:var(--porcelain)}
  .miss{flex:1;min-height:0;border:none;border-radius:12px;background:var(--line);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    box-shadow:0 10px 26px rgba(232,64,47,.3)}
  .miss .t{font-size:34px;font-weight:900}
  .miss .sub{font-size:14px;font-weight:700;opacity:.9}
  .undo{height:54px;margin:10px 0 0;border-radius:10px;background:transparent;color:var(--amber);
    border:1.5px solid rgba(245,166,35,.5);font-size:16px;font-weight:700}
  .foot{display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px 16px;font-size:13px;font-weight:600;color:var(--mute)}
  .foot .xfer{display:flex;align-items:center;gap:7px;color:var(--cobalt);font-weight:700}
  .foot .xfer i{width:12px;height:12px;border-radius:50%;border:3px solid var(--cobalt)}
  svg{display:block}
</style></head>
<body>

  <div class="head">
    <div class="who"><span class="cls num">1반 7번</span><span class="nm">강지호</span></div>
    <div class="save"><i></i>저장됨</div>
  </div>

  <div class="map">
    <div class="rail">
      <div class="track"></div><div class="done"></div>
      <div class="st p"><span class="dot"></span><span class="lab num">① 5점</span></div>
      <div class="st p"><span class="dot"></span><span class="lab num">② 4점</span></div>
      <div class="st now"><span class="dot"></span><span class="lab num">③<span class="delay">실수 2</span></span></div>
      <div class="st"><span class="dot"></span><span class="lab num">④</span></div>
      <div class="st"><span class="dot"></span><span class="lab num">⑤</span></div>
      <div class="st"><span class="dot"></span><span class="lab num">⑥</span></div>
      <div class="st"><span class="dot"></span><span class="lab num">⑦</span></div>
      <div class="st"><span class="dot"></span><span class="lab num">⑧</span></div>
    </div>

    <div class="work">
      <div class="step num">3 / 8번째 동작</div>
      <div class="name">③ 번갈아<br>두박자 뛰기</div>
      <div class="score">
        <span class="lab">실수</span><b class="m num">2</b>
        <span class="lab">→</span><b class="p num">3</b><span class="lab">점</span>
      </div>
      <button class="miss">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        <span class="t">실수</span>
        <span class="sub">한 번 더 → 2점</span>
      </button>
      <button class="undo">↩ 되돌리기</button>
    </div>
  </div>

  <div class="foot">
    <span>옆으로 쓸면 다음 역</span>
    <span class="xfer"><i></i>2차 재도전 환승</span>
  </div>

</body></html>
