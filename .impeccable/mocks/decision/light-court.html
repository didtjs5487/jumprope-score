<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>코트 라인 — 채점 중</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ground:#FBFAF7; --card:#FFFFFF; --rule:#E7E4DC; --ink:#1C2026; --mute:#7C8390;
    --court:#1F5FD0; --coral:#E8402F; --amber:#F2A118; --grass:#1E9E5A;
  }
  html,body{width:390px;height:844px;overflow:hidden}
  body{background:var(--ground);color:var(--ink);font-family:"Noto Sans KR",sans-serif;
    font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
  .num{font-family:"Barlow Condensed","Noto Sans KR",sans-serif}

  .head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px}
  .who{display:flex;align-items:baseline;gap:9px}
  .who .cls{font-size:15px;font-weight:700;color:var(--mute)}
  .who .nm{font-size:26px;font-weight:700;letter-spacing:-.01em}
  .save{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--grass)}
  .save i{width:8px;height:8px;border-radius:50%;background:var(--grass)}

  /* 코트 라인 — 8개 동작이 바닥 라인 위의 눈금으로 선다 */
  .court{padding:4px 18px 18px}
  .lane{position:relative;height:52px}
  .lane .base{position:absolute;left:0;right:0;top:34px;height:3px;background:var(--court);
    opacity:.22;border-radius:2px}
  .lane .run{position:absolute;left:0;top:34px;height:3px;width:34%;background:var(--court);border-radius:2px}
  .ticks{position:relative;display:grid;grid-template-columns:repeat(8,1fr);height:52px}
  .tk{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px}
  .tk .v{font-size:19px;font-weight:600;color:var(--ink);line-height:1}
  .tk .v.off{color:#C6C9CE}
  .tk .m{width:3px;height:13px;background:#CBD2DE;border-radius:2px}
  .tk.done .m{background:var(--court)}
  .tk.now .m{width:22px;height:22px;border-radius:50%;background:var(--card);
    border:4px solid var(--coral);margin-bottom:-5px;
    box-shadow:0 0 0 6px rgba(232,64,47,.12);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 5px rgba(232,64,47,.10)}50%{box-shadow:0 0 0 10px rgba(232,64,47,.18)}}
  .tk.now .v{color:var(--coral);font-weight:700}

  /* 지금 동작 */
  .now{padding:0 18px}
  .now .step{font-size:14px;font-weight:700;color:var(--coral);letter-spacing:.05em}
  .now .name{font-size:31px;font-weight:700;line-height:1.2;margin-top:5px;letter-spacing:-.02em}

  .score{display:flex;align-items:center;gap:10px;margin:14px 18px 0;padding:12px 16px;
    background:var(--card);border:1px solid var(--rule);border-radius:14px}
  .score .lab{font-size:15px;font-weight:500;color:var(--mute)}
  .score b{font-size:26px;font-weight:600}
  .score .mk{display:flex;gap:6px;margin-left:auto}
  .score .mk i{width:13px;height:13px;border-radius:50%;background:#E7E4DC}
  .score .mk i.on{background:var(--coral)}

  /* 실수 — 흰 버튼에 코랄 링. 눌리면 링이 채워진다 */
  .miss{flex:1;min-height:0;margin:14px 18px 0;border-radius:22px;background:var(--card);
    border:3px solid var(--coral);color:var(--coral);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    box-shadow:0 8px 20px rgba(28,32,38,.07)}
  .miss .t{font-size:38px;font-weight:700;letter-spacing:-.01em}
  .miss .s{font-size:15px;font-weight:500;color:var(--mute)}

  .row{display:flex;gap:10px;padding:12px 18px 8px}
  .undo{flex:1;height:56px;border-radius:14px;background:var(--card);border:1px solid var(--rule);
    color:var(--ink);font-size:16px;font-weight:700;display:flex;align-items:center;
    justify-content:center;gap:8px}
  .hint{text-align:center;font-size:13px;font-weight:500;color:var(--mute);padding-bottom:16px}
  .hint b{color:var(--court);font-weight:700}
  svg{display:block}
</style></head>
<body>

  <div class="head">
    <div class="who"><span class="cls num">1반 7번</span><span class="nm">강지호</span></div>
    <div class="save"><i></i>저장됨</div>
  </div>

  <div class="court">
    <div class="lane">
      <div class="base"></div><div class="run"></div>
      <div class="ticks">
        <div class="tk done"><span class="v num">5</span><span class="m"></span></div>
        <div class="tk done"><span class="v num">4</span><span class="m"></span></div>
        <div class="tk now"><span class="v num">3</span><span class="m"></span></div>
        <div class="tk"><span class="v num off">·</span><span class="m"></span></div>
        <div class="tk"><span class="v num off">·</span><span class="m"></span></div>
        <div class="tk"><span class="v num off">·</span><span class="m"></span></div>
        <div class="tk"><span class="v num off">·</span><span class="m"></span></div>
        <div class="tk"><span class="v num off">·</span><span class="m"></span></div>
      </div>
    </div>
  </div>

  <div class="now">
    <div class="step num">3 / 8번째 동작</div>
    <div class="name">③ 번갈아두박자 뛰기</div>
  </div>

  <div class="score">
    <span class="lab">실수</span><b class="num">2</b><span class="lab">회 · 지금</span><b class="num">3</b><span class="lab">점</span>
    <span class="mk"><i class="on"></i><i class="on"></i><i></i><i></i></span>
  </div>

  <button class="miss">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#E8402F" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    <span class="t">실수</span>
    <span class="s">한 번 더 누르면 2점</span>
  </button>

  <div class="row">
    <button class="undo">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1C2026" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
      되돌리기
    </button>
  </div>
  <div class="hint">옆으로 쓸면 <b>다음 동작</b> · 눕히면 버튼만 크게</div>

</body></html>
