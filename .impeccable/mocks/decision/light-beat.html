<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>16박자 — 채점 중</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#FFFFFF; --ground:#F6F7F9; --rule:#E3E6EA; --ink:#12161C; --mute:#79818E;
    --beat:#00B386; --coral:#FF5B4A; --violet:#6C63FF;
  }
  html,body{width:390px;height:844px;overflow:hidden}
  body{background:var(--ground);color:var(--ink);font-family:"Noto Sans KR",sans-serif;
    font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
  .num{font-family:"Barlow Condensed","Noto Sans KR",sans-serif}

  .head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
  .who{display:flex;align-items:baseline;gap:9px}
  .who .cls{font-size:15px;font-weight:700;color:var(--mute)}
  .who .nm{font-size:26px;font-weight:700;letter-spacing:-.01em}
  .save{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--beat)}
  .save i{width:8px;height:8px;border-radius:50%;background:var(--beat)}

  /* 마디 — 8개 동작이 여덟 마디. 끝난 마디는 점수를 적어 둔다 */
  .bars{display:grid;grid-template-columns:repeat(8,1fr);gap:0;margin:0 18px;
    background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
  .bar{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;border-right:1px solid var(--rule)}
  .bar:last-child{border-right:none}
  .bar .i{font-size:12px;font-weight:500;color:#A9B0BA}
  .bar .v{font-size:20px;font-weight:600;color:#C3C9D1;line-height:1}
  .bar.done .v{color:var(--ink)} .bar.done .i{color:var(--mute)}
  .bar.now{background:rgba(0,179,134,.10);box-shadow:inset 0 3px 0 var(--beat)}
  .bar.now .i{color:var(--beat);font-weight:700} .bar.now .v{color:var(--beat)}

  /* 지금 동작 + 16박자 눈금 */
  .now{padding:18px 18px 0}
  .now .step{font-size:14px;font-weight:700;color:var(--beat);letter-spacing:.05em}
  .now .name{font-size:31px;font-weight:700;line-height:1.2;margin-top:5px;letter-spacing:-.02em}
  .beats{display:flex;gap:4px;align-items:flex-end;height:30px;margin:14px 0 0}
  .beats i{flex:1;height:12px;border-radius:2px;background:#E3E6EA}
  .beats i.s{height:22px;background:#CBD2DA}
  .blab{display:flex;justify-content:space-between;font-size:12px;font-weight:500;
    color:var(--mute);margin-top:6px}
  .meter{display:flex;gap:8px;margin-top:14px}
  .meter i{flex:1;height:16px;border-radius:4px;background:#E3E6EA}
  .meter i.on{background:var(--coral)}

  .score{display:flex;align-items:baseline;gap:9px;margin:14px 18px 0;padding:12px 16px;
    background:var(--paper);border:1px solid var(--rule);border-radius:12px}
  .score .lab{font-size:15px;font-weight:500;color:var(--mute)}
  .score b{font-size:27px;font-weight:600}
  .score .p{color:var(--beat)}

  .miss{flex:1;min-height:0;margin:14px 18px 0;border-radius:18px;border:none;
    background:var(--coral);color:#fff;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;
    box-shadow:0 10px 24px rgba(255,91,74,.22)}
  .miss .t{font-size:36px;font-weight:700}
  .miss .s{font-size:14px;font-weight:500;opacity:.92}

  .row{display:flex;gap:10px;padding:12px 18px 8px}
  .undo{flex:1;height:54px;border-radius:14px;background:var(--paper);border:1px solid var(--rule);
    color:var(--ink);font-size:16px;font-weight:700;display:flex;align-items:center;
    justify-content:center;gap:8px}
  .hint{text-align:center;font-size:13px;font-weight:500;color:var(--mute);padding-bottom:16px}
  .hint b{color:var(--violet);font-weight:700}
  svg{display:block}
</style></head>
<body>

  <div class="head">
    <div class="who"><span class="cls num">1반 7번</span><span class="nm">강지호</span></div>
    <div class="save"><i></i>저장됨</div>
  </div>

  <div class="bars">
    <div class="bar done"><span class="i num">1</span><span class="v num">5</span></div>
    <div class="bar done"><span class="i num">2</span><span class="v num">4</span></div>
    <div class="bar now"><span class="i num">3</span><span class="v num">3</span></div>
    <div class="bar"><span class="i num">4</span><span class="v num">·</span></div>
    <div class="bar"><span class="i num">5</span><span class="v num">·</span></div>
    <div class="bar"><span class="i num">6</span><span class="v num">·</span></div>
    <div class="bar"><span class="i num">7</span><span class="v num">·</span></div>
    <div class="bar"><span class="i num">8</span><span class="v num">·</span></div>
  </div>

  <div class="now">
    <div class="step num">3 / 8번째 동작 · 16박자</div>
    <div class="name">③ 번갈아두박자 뛰기</div>
    <div class="beats">
      <i class="s"></i><i></i><i></i><i></i><i class="s"></i><i></i><i></i><i></i>
      <i class="s"></i><i></i><i></i><i></i><i class="s"></i><i></i><i></i><i></i>
    </div>
    <div class="blab"><span class="num">1박</span><span>이 동작은 16박자</span><span class="num">16박</span></div>
    <div class="meter"><i class="on"></i><i class="on"></i><i></i><i></i></div>
  </div>

  <div class="score">
    <span class="lab">실수</span><b class="num">2</b><span class="lab">회 · 지금</span>
    <b class="p num">3</b><span class="lab">점</span>
  </div>

  <button class="miss">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    <span class="t">실수</span>
    <span class="s">한 번 더 누르면 2점</span>
  </button>

  <div class="row">
    <button class="undo">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#12161C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
      되돌리기
    </button>
  </div>
  <div class="hint">옆으로 쓸면 <b>다음 마디</b> · 눕히면 버튼만 크게</div>

</body></html>
